name: AI consumer source

on:
  schedule:
    - cron: '10 13 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - research/collect_openai_signals.py
      - research/update_ai_consumer.py
      - research/validate_ai_consumer.py
      - .github/workflows/ai-consumer-source.yml

permissions:
  contents: write

concurrency:
  group: ai-consumer-source
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refresh official adoption evidence
        run: python research/update_ai_consumer.py
      - name: Validate canonical outputs
        run: python research/validate_ai_consumer.py
      - name: Commit changed evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+KAFKA2306@users.noreply.github.com
          git add api/v1/ai-consumer
          if git diff --cached --quiet; then
            echo 'No consumer-AI evidence change.'
            exit 0
          fi
          git commit -m 'data: update consumer AI primary evidence'
          git push
