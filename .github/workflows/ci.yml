name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q research tests
      - name: Unit tests
        run: python -m unittest tests.test_openai_signals_collector tests.test_ai_consumer_ledger -v
      - name: Build live primary-source evidence
        run: python research/update_ai_consumer.py --output /tmp/ai-consumer
      - name: Validate live outputs
        run: python research/validate_ai_consumer.py /tmp/ai-consumer
      - name: Clean checkout
        run: |
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain --untracked-files=all)"
