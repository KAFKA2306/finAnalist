name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consumer-ai:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Parse current consumer-AI code
        run: python -c "import ast, pathlib; files = list(pathlib.Path('research').glob('*.py')) + [pathlib.Path('tests/test_openai_signals_collector.py')]; [ast.parse(path.read_text(encoding='utf-8'), filename=str(path)) for path in files]"
      - name: Test OpenAI Signals collector
        run: python -m unittest tests.test_openai_signals_collector -v
      - name: Validate Google observations
        run: python -m json.tool data/ai-consumer/google-search-2026.json > /dev/null
      - name: Clean checkout
        run: test -z "$(git status --porcelain)"
