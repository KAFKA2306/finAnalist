name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consumer-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q research tests
      - name: Unit tests
        run: python -m unittest tests.test_openai_signals_collector tests.test_ai_consumer_ledger -v
      - name: Build live primary-source evidence
        run: python research/update_ai_consumer.py --output /tmp/ai-consumer
      - name: Audit live outputs
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path
          root = Path('/tmp/ai-consumer')
          metrics = json.loads((root/'metrics.json').read_text())['observations']
          features = json.loads((root/'features.json').read_text())['events']
          comparison = json.loads((root/'comparison.json').read_text())
          signals = json.loads((root/'openai-signals.json').read_text())
          manifest = json.loads((root/'manifest.json').read_text())
          assert {r['provider'] for r in metrics} == {'OpenAI','Google','Meta'}
          assert {r['provider'] for r in features} == {'OpenAI','Google','Meta'}
          assert len(metrics) >= 18
          dates = sorted(date.fromisoformat(r['as_of']) for r in metrics)
          assert (dates[-1] - dates[0]).days >= 365
          assert all(r['definition'] and r['geography'] and r['period'] and r['source_url'] for r in metrics)
          assert all(e['definition'] and e['geography'] and e['source_url'] for e in features)
          assert 'never converted' in comparison['rule']
          assert signals['files']
          assert manifest['primary_source_count'] >= 12
          assert all(item['sha256'] and item['bytes'] > 0 for item in manifest['sources'])
          print({'metrics':len(metrics),'features':len(features),'primary_sources':manifest['primary_source_count'],'signals_files':len(signals['files'])})
          PY
      - name: Clean checkout
        run: test -z "$(git status --porcelain)"
